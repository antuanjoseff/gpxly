# Afegir a layers/poi/poi.yaml dins la secció mappings:
# (Busca on s'acaben els altres mappings i afegeix això)

  # Springs - Fonts d'aigua naturals
  - if:
      natural: spring
    then:
      class: spring
      subclass: spring
      name: "${name}"
      name:ca: "${name:ca}"
      name:es: "${name:es}"
      name:en: "${name:en}"
      name:latin: "${name:latin}"
      rank: 25  # Prioritat baixa, apareix a zooms alts
