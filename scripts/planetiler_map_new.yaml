# Esquema Planetiler 2.21.2 compatible amb l'estil assets/osm_bright_offline.json
# Genera les source-layer que l'estil espera amb les dades de senderisme.
schema_name: "SenderismeComplet"
schema_description: "Mapa vectorial offline de senderisme compatible amb OSM Bright"
attribution: '<a href="https://openstreetmap.org">&copy; OpenStreetMap</a>'

sources:
  osm:
    type: osm
    url: "local"

layers:
  # ═══════════════════════════════════════════════════════════
  # WATER — polígons d'aigua
  # ═══════════════════════════════════════════════════════════
  - id: water
    features:
      - source: osm
        geometry: polygon
        min_zoom: 0
        max_zoom: 14
        include_when:
          natural: [water, coastline, bay, strait]
          landuse: [reservoir, basin]
          waterway: [riverbank, dock]
        attributes:
          - key: name
          - key: natural
          - key: landuse
          - key: waterway
          - key: water
        post_process:
          - set:
              class: "${ tags.natural ?? tags.landuse ?? tags.waterway ?? 'water' }"

  # ═══════════════════════════════════════════════════════════
  # WATERWAY — rius, rieres, canals (línies)
  # ═══════════════════════════════════════════════════════════
  - id: waterway
    features:
      - source: osm
        geometry: line
        min_zoom: 5
        max_zoom: 14
        include_when:
          waterway: [river, stream, canal, ditch, drain]
          natural: [coastline]
        attributes:
          - key: name
          - key: waterway
          - key: natural
          - key: intermittent
        post_process:
          - set:
              class: "${ tags.waterway ?? 'coastline' }"

  # ═══════════════════════════════════════════════════════════
  # WATER_NAME — etiquetes de masses d'aigua
  # ═══════════════════════════════════════════════════════════
  - id: water_name
    features:
      - source: osm
        geometry: point
        min_zoom: 8
        max_zoom: 14
        include_when:
          natural: [water, bay, strait, cape]
          waterway: [river]
        attributes:
          - key: name
          - key: natural
        post_process:
          - set:
              class: "${ tags.natural ?? 'water' }"
              "name:latin": "${ tags.name }"

  # ═══════════════════════════════════════════════════════════
  # TRANSPORTATION — carreteres, camins i senders
  # ═══════════════════════════════════════════════════════════
  - id: transportation
    features:
      - source: osm
        geometry: line
        min_zoom: 4
        max_zoom: 14
        include_when:
          highway: [motorway, trunk, primary, secondary, tertiary,
                    unclassified, residential, service, track,
                    path, footway, cycleway, bridleway, steps,
                    pedestrian, living_street]
        attributes:
          - key: name
          - key: highway
          - key: surface
          - key: tracktype
          - key: sac_scale
          - key: trail_visibility
          - key: bridge
          - key: tunnel
          - key: oneway
          - key: ref
        post_process:
          - set:
              class: "${ tags.highway }"
              subclass: "${ tags.highway }"

  # ═══════════════════════════════════════════════════════════
  # TRANSPORTATION_NAME — noms de carreteres i camins
  # ═══════════════════════════════════════════════════════════
  - id: transportation_name
    features:
      - source: osm
        geometry: line
        min_zoom: 10
        max_zoom: 14
        include_when:
          highway: [motorway, trunk, primary, secondary, tertiary,
                    unclassified, residential, track, path, footway]
        attributes:
          - key: name
          - key: highway
          - key: ref
        post_process:
          - set:
              class: "${ tags.highway }"
              "name:latin": "${ tags.name }"

  # ═══════════════════════════════════════════════════════════
  # RUTES DE SENDERISME SENYALITZADES (GR, PR, SL...)
  # ═══════════════════════════════════════════════════════════
  - id: hiking_routes
    features:
      - source: osm
        geometry: line
        min_zoom: 6
        max_zoom: 14
        include_when:
          route: [hiking, foot, walking]
        attributes:
          - key: name
          - key: route
          - key: network
          - key: ref
          - key: symbol
          - key: colour
          - key: osmc:symbol
        post_process:
          - set:
              class: "${ tags.network ?? 'rwn' }"

  # ═══════════════════════════════════════════════════════════
  # BUILDING — edificis
  # ═══════════════════════════════════════════════════════════
  - id: building
    features:
      - source: osm
        geometry: polygon
        min_zoom: 13
        max_zoom: 14
        include_when:
          building: true
        attributes:
          - key: building

  # ═══════════════════════════════════════════════════════════
  # LANDCOVER — vegetació (bosc, prat, matollar...)
  # ═══════════════════════════════════════════════════════════
  - id: landcover
    features:
      - source: osm
        geometry: polygon
        min_zoom: 5
        max_zoom: 14
        include_when:
          natural: [wood, scrub, heath, grassland, glacier, bare_rock, scree, sand, beach]
          landuse: [forest, meadow, orchard, vineyard, grass, farmland]
        attributes:
          - key: natural
          - key: landuse
        post_process:
          - set:
              class: "${ tags.natural ?? tags.landuse }"
              subclass: "${ tags.natural ?? tags.landuse }"

  # ═══════════════════════════════════════════════════════════
  # LANDUSE — usos del sòl
  # ═══════════════════════════════════════════════════════════
  - id: landuse
    features:
      - source: osm
        geometry: polygon
        min_zoom: 8
        max_zoom: 14
        include_when:
          landuse: [residential, industrial, commercial, retail,
                    cemetery, allotments, quarry, landfill, military]
          amenity: [school, university, hospital, parking]
          leisure: [park, garden, pitch, playground, golf_course]
        attributes:
          - key: landuse
          - key: amenity
          - key: leisure
          - key: name
        post_process:
          - set:
              class: "${ tags.landuse ?? tags.amenity ?? tags.leisure }"

  # ═══════════════════════════════════════════════════════════
  # PARK — parcs naturals i zones protegides
  # ═══════════════════════════════════════════════════════════
  - id: park
    features:
      - source: osm
        geometry: polygon
        min_zoom: 5
        max_zoom: 14
        include_when:
          boundary: [national_park, protected_area, nature_reserve]
          leisure: [nature_reserve]
        attributes:
          - key: name
          - key: boundary
          - key: leisure
          - key: protect_class
        post_process:
          - set:
              class: "${ tags.boundary ?? tags.leisure }"

  # ═══════════════════════════════════════════════════════════
  # PLACE — pobles, ciutats, llocs
  # ═══════════════════════════════════════════════════════════
  - id: place
    features:
      - source: osm
        geometry: point
        min_zoom: 4
        max_zoom: 14
        include_when:
          place: [city, town, village, hamlet, isolated_dwelling,
                  suburb, neighbourhood, locality]
        attributes:
          - key: name
          - key: place
          - key: population
        post_process:
          - set:
              class: "${ tags.place }"
              "name:latin": "${ tags.name }"

  # ═══════════════════════════════════════════════════════════
  # MOUNTAIN_PEAK — cims, turons, volcans
  # ═══════════════════════════════════════════════════════════
  - id: mountain_peak
    features:
      - source: osm
        geometry: point
        min_zoom: 9
        max_zoom: 14
        include_when:
          natural: [peak, volcano, saddle, ridge]
        attributes:
          - key: name
          - key: natural
          - key: ele
        post_process:
          - set:
              class: "${ tags.natural }"
              "name:latin": "${ tags.name }"
              ele: "${ tags.ele }"

  # ═══════════════════════════════════════════════════════════
  # HIKING_POIS — fonts, refugis, coves, miradors...
  # ═══════════════════════════════════════════════════════════
  - id: hiking_pois
    features:
      - source: osm
        geometry: point
        min_zoom: 10
        max_zoom: 14
        include_when:
          natural: [spring, cave_entrance, waterfall, hot_spring, geyser]
          amenity: [drinking_water, shelter, water_point]
          tourism: [alpine_hut, wilderness_hut, viewpoint, picnic_site, camp_site]
          leisure: [picnic_table]
          emergency: [phone, access_point]
        attributes:
          - key: name
          - key: natural
          - key: amenity
          - key: tourism
          - key: leisure
          - key: emergency
          - key: ele
          - key: drinking_water
        post_process:
          - set:
              class: "${ tags.natural ?? tags.amenity ?? tags.tourism ?? tags.leisure ?? tags.emergency }"
              "name:latin": "${ tags.name }"

  # ═══════════════════════════════════════════════════════════
  # POI — punts d'interès urbans
  # ═══════════════════════════════════════════════════════════
  - id: poi
    features:
      - source: osm
        geometry: point
        min_zoom: 12
        max_zoom: 14
        include_when:
          amenity: [restaurant, cafe, bar, pharmacy, bank, fuel,
                    parking, toilets, bench]
          shop: [supermarket, convenience, bakery, outdoor]
          tourism: [hotel, hostel, guest_house, information, museum]
          public_transport: [station, bus_stop]
          railway: [station, halt]
        attributes:
          - key: name
          - key: amenity
          - key: shop
          - key: tourism
          - key: railway
          - key: public_transport
        post_process:
          - set:
              class: "${ tags.amenity ?? tags.shop ?? tags.tourism ?? tags.railway ?? tags.public_transport }"
              "name:latin": "${ tags.name }"

  # ═══════════════════════════════════════════════════════════
  # BOUNDARY — límits administratius
  # ═══════════════════════════════════════════════════════════
  - id: boundary
    features:
      - source: osm
        geometry: line
        min_zoom: 4
        max_zoom: 14
        include_when:
          boundary: [administrative]
        attributes:
          - key: admin_level
          - key: boundary
        post_process:
          - set:
              class: "administrative"

  # ═══════════════════════════════════════════════════════════
  # AEROWAY + AERODROME_LABEL — requerides per l'estil
  # ═══════════════════════════════════════════════════════════
  - id: aeroway
    features:
      - source: osm
        geometry: line
        min_zoom: 10
        max_zoom: 14
        include_when:
          aeroway: [runway, taxiway]
        attributes:
          - key: aeroway

  - id: aerodrome_label
    features:
      - source: osm
        geometry: point
        min_zoom: 10
        max_zoom: 14
        include_when:
          aeroway: [aerodrome]
        attributes:
          - key: name
          - key: aeroway
        post_process:
          - set:
              class: "${ tags.aeroway }"
              "name:latin": "${ tags.name }"
