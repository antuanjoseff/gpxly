plugins {
    id "com.android.application"
    id "kotlin-android"
    // El plugin de Flutter s'aplica després d'Android i Kotlin
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.gpxly"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    defaultConfig {
        applicationId "com.example.gpxly"
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            // Configuració de signatura per defecte
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    // Registrem la dependència al teu plugin local
    implementation project(':gps_plugin')
}
